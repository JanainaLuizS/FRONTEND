<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delícia Express - Fazer Pedido</title>
    <!-- Se tiver um CSS, pode ligar aqui: <link rel="stylesheet" href="css/styles.css"> -->
</head>
<body>

    <h2>Faça seu pedido</h2>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Digite seu nome">

    <br><br>

    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade" min="1" value="1">

    <br><br>

    <button id="botaoPedido">Calcular pedido</button>

    <h2>Resumo do Pedido</h2>
    <p id="resultado">Preencha os campos e clique no botão.</p>

    <!-- Chamada do JavaScript (ajustada para a pasta js/main.js) -->
    <script src="scripts/main.js"></script>
</body>
</html>
