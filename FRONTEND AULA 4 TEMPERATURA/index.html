<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div class="container">

        <div class="cabecalho">
            <h1> Tempo Agora </h1>
            <p> Informações meteorológicas da sua cidade</p>
        </div>

        <div class="cidade">
            <h2> Valença -RJ </h2>
            <p> Terça-Feira - 27 de outubro</p>
            <span> Tempo estável</span>
        </div>

        <div class="previsao">
            <div class="temperatura">
                <img src="" alt="images/sun (1).svg" alt="ícone de sol" />
                <h1>28°C</h1>
                <h3>Ensolarado</h3>
                <p>Sensação Térmica : 30°C</p>
            </div>

            <div class="detalhes">

  <div class="informacao">
                    <img src="images/droplet (1).svg" alt="Icone de umidade">
                    <p>Umidade</p>
                    <h2>65%</h2>
                </div>

                <div class="informacao">
                    <img src="images/wind (2).svg" alt="Icone vento">
                    <p>Vento</p>
                    <h2>12 km/h</h2>

                </div>
            </div>
        </div>

    </div>
    <div class="dica"
    
    img src
    ></div>
</body>

</html>
