<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cursos SENAI</title>
</head>

<body>

    <div class="container">

        <!-- Cabeçalho -->
        <div class="cabecalho">
            <h1>Cursos SENAI</h1>
            <p>Conheça nossas áreas de formação</p>
        </div>

        <!-- Inscrições abertas (Tag de fecho corrigida) -->
        <div class="inscricao">
            <h2>Inscrições abertas</h2>
        </div>

        <!-- Seção de Cursos dividida em cards individuais -->
        <div class="cursos">
            <div class="card-curso">
                <h2>Desenvolvimento de Sistemas</h2>
                <p>Aprenda programação e criação de aplicações.</p>
                <span>Tecnologia</span>
            </div>

            <div class="card-curso">
                <h2>Redes de Computadores</h2>
                <p>Conheça redes, equipamentos e conexões.</p>
                <span>Infraestrutura</span>
            </div>
        </div>

        <!-- Rodapé / Saiba mais  -->
        <div class="informacao">
            <button class="btn-saiba-mais">Saiba mais</button>
            <p>SENAI - Educação profissional</p>
        </div>

    </div>

    <script src="scripts/main.js"></script>
</body>

</html>
